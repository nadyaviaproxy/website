<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>documentation</title>

<style>

body {
    font-family: serif;
}

/* comments */

.comment {
    font-family: monospace;
    color: darkblue;
}

/* gallery */

.gallery {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

/* standardised containers */

.hover-image {
    position: relative;

    width: 220px;
    height: 220px;

    overflow: visible;

    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: zoom-in;
}

/* make all images same size */

.hover-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* hover caption */

.hover-caption {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;

    background: white;
    padding: 6px 8px;

    font-size: 0.9em;
    font-style: italic;

    white-space: nowrap;

    z-index: 20;
}

.hover-image:hover .hover-caption {
    display: block;
}

/* fullscreen image */

.lightbox {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(255,255,255,0.95);

    justify-content: center;
    align-items: center;

    z-index: 1000;
}

.lightbox img {
    max-width: 90vw;
    max-height: 90vh;
}

.lightbox:target {
    display: flex;
}

</style>
</head>
